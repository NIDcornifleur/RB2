<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RB2 — Terrain4</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0d10;
      --panel: #14191f;
      --panel-2: #1b222a;
      --line: #35404b;
      --text: #f2f5f7;
      --muted: #aab5bf;
      --blue: #1976d2;
      --green: #16803c;
      --orange: #a55408;
      --red: #c0162d;
      --purple: #6741a5;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.35 Arial, Helvetica, sans-serif;
      overscroll-behavior: none;
    }

    button, a.button {
      min-height: 44px;
      border: 1px solid #536171;
      border-radius: 9px;
      background: #28313a;
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      touch-action: manipulation;
      user-select: none;
    }

    button:active, a.button:active { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: wait; }
    .blue { background: var(--blue); }
    .green { background: var(--green); }
    .orange { background: var(--orange); }
    .red { background: var(--red); }
    .purple { background: var(--purple); }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      background: rgba(13, 17, 22, .97);
      border-bottom: 1px solid var(--line);
    }

    .title { margin-right: auto; min-width: 145px; }
    .title strong { display: block; font-size: 17px; }
    .title small { color: var(--muted); }
    .topbar .button, .topbar button { min-height: 38px; padding: 6px 10px; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 10px;
      padding: 10px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .main, .side { display: grid; align-content: start; gap: 10px; min-width: 0; }

    .visual-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      min-width: 0;
      align-items: start;
    }

    .card {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
    }

    .camera-frame {
      position: relative;
      background: #000;
      border: 1px solid #303943;
      border-radius: 8px;
      overflow: hidden;
    }

    #camera {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    #cameraState {
      position: absolute;
      left: 8px;
      top: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .72);
      color: #d3dbe2;
      font-size: 12px;
      font-weight: 800;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-top: 8px;
    }

    .pill {
      padding: 7px;
      border: 1px solid #485562;
      border-radius: 8px;
      background: #222a32;
      color: #d8e0e6;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }

    .pill.ok { border-color: #29954d; color: #8ff0ae; }
    .pill.warn { border-color: #bd741b; color: #ffd08a; }
    .pill.bad { border-color: #c93b4e; color: #ff9ba8; }

    /* INFO-PANEL:BEGIN — bandeau d'état sous la caméra (retrait : supprimer les blocs INFO-PANEL) */
    .info-panel { display: grid; gap: 7px; margin-top: 8px; }
    .info-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .tilt-canvas { display: block; width: 100%; height: 118px; border: 1px solid #485562; border-radius: 8px; background: #222a32; }
    .info-row .pill { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill.blink { animation: info-blink 1s infinite; }
    @keyframes info-blink { 50% { opacity: .45; } }
    /* INFO-PANEL:END */

    .drive-grid, .pt-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .drive-grid button {
      min-height: 66px;
      font-size: 17px;
      touch-action: none;
    }

    .drive-grid button.active {
      background: #0d8f42;
      outline: 3px solid #70e99a;
    }

    .drive-grid .stop {
      background: #d30f2b;
      border-color: #ff7285;
      font-size: 18px;
    }

    .speed-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .speed-row button { min-height: 38px; padding: 5px; }
    .speed-row button.active { background: #1669af; outline: 2px solid #63b6f5; }

    .pt-grid button { min-height: 52px; font-size: 20px; }
    .pt-readout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #394652;
      border-radius: 8px;
      background: #0f1419;
      font-weight: 800;
    }

    .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .one { grid-template-columns: 1fr; }

    .lidar-frame {
      position: relative;
      min-height: 320px;
      border: 1px solid #303943;
      border-radius: 8px;
      overflow: hidden;
      background: #030607;
    }

    #lidarCanvas {
      display: block;
      width: 100%;
      height: min(66vh, 720px);
      min-height: 320px;
      background: #030607;
    }

    #lidarState {
      position: absolute;
      left: 8px;
      top: 8px;
      padding: 4px 8px;
      border: 1px solid #48606e;
      border-radius: 999px;
      background: rgba(0, 0, 0, .75);
      color: #d8e3ea;
      font-size: 12px;
      font-weight: 800;
    }

    .topbar #shutdownBtn { width: auto; min-height: 38px; font-size: 13px; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(5, 7, 9, .72);
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 340px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      display: grid;
      gap: 8px;
    }

    .modal-box h2 { margin: 0 0 4px; font-size: 16px; }

    .modal-box label { font-size: 12px; color: var(--muted); font-weight: 700; }

    .modal-box input {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #536171;
      border-radius: 8px;
      background: #1b222a;
      color: var(--text);
      font: inherit;
    }

    .modal-msg { min-height: 18px; font-size: 12px; font-weight: 700; color: var(--muted); }
    .modal-msg.error { color: #ff9ba8; }
    .modal-msg.ok { color: #7be0a0; }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .side { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .side .full { grid-column: 1 / -1; }
      #lidarCanvas { height: min(58vh, 620px); }
    }

    @media (max-width: 1250px) {
      .visual-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 650px) {
      .topbar { flex-wrap: wrap; }
      .title { width: 100%; }
      .layout { padding: 6px; gap: 6px; }
      .side { grid-template-columns: 1fr; }
      .button-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #lidarCanvas { height: 45vh; min-height: 240px; }
      .lidar-frame { min-height: 240px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title">
      <strong>RB2 — Terrain4</strong>
      <strong>Roméo St-Cyr, juillet 2026</strong>
    </div>
    <button id="shutdownBtn" class="red" type="button">ARRET RB2</button>
    <button id="lightBtn" type="button">LUMIÈRES —</button>
    <button id="relay2Btn" type="button">RELAIS 2 —</button>
    <span id="linkState" class="pill">Lien —</span>
    <button id="wifiBtn" type="button">Wi‑Fi local —</button>
    <a class="button blue" href="/lidar_drive2">LIDAR DRIVE</a>
    <a class="button red" href="/secours">SECOURS</a>
  </header>

  <main class="layout">
    <section class="main">
      <div class="visual-grid">
        <div class="card">
          <div class="camera-frame">
            <canvas id="camera"></canvas>
            <span id="cameraState">connexion…</span>
          </div>
          <div class="button-row">
            <button id="photoBtn" class="blue" type="button">PHOTO</button>
            <button id="videoBtn" class="orange" type="button">VIDÉO</button>
            <a class="button purple" href="/captures" target="_blank">CAPTURES</a>
            <button id="reloadCameraBtn" type="button">RECHARGER IMAGE</button>
            <a class="button green" href="/zero_cam_stream.mjpg" target="_blank">CAMÉRA DIRECTE</a>
            <button id="restartCameraBtn" class="red" type="button">RESTART CAMÉRA</button>
          </div>
          <!-- INFO-PANEL:BEGIN -->
          <div class="info-panel">
            <div class="info-row">
              <span id="infoSensors" class="pill">Capteurs —</span>
              <span id="infoWifi" class="pill">Wi‑Fi —</span>
            </div>
            <div class="info-row eau">
              <span id="infoFloor" class="pill">SOL —</span>
              <span id="infoCeil" class="pill">PLAFOND —</span>
            </div>
            <canvas id="infoTiltCanvas" class="tilt-canvas" title="Horizon artificiel (IMU BNO055)"></canvas>
          </div>
          <!-- INFO-PANEL:END -->
        </div>

        <div class="card">
          <div class="lidar-frame">
            <canvas id="lidarCanvas"></canvas>
            <span id="lidarState">LIDAR —</span>
          </div>
          <div class="button-row two">
            <button id="lidarZoomOutBtn" type="button">ZOOM −</button>
            <button id="lidarZoomInBtn" type="button">ZOOM +</button>
          </div>
          <div class="button-row">
            <button id="wifi5gBtn" type="button">5G</button>
            <button id="wifiSsidBtn" type="button">SSID</button>
            <button id="wifiDisconnectBtn" type="button">DÉCONNEXION</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="side">
      <div class="card full">
        <div id="drivePad" class="drive-grid">
          <span></span>
          <button type="button" data-drive="forward">▲<br>AVANCE</button>
          <span></span>
          <button type="button" data-drive="left">◀<br>GAUCHE</button>
          <button id="stopBtn" class="stop" type="button" data-drive="stop">STOP</button>
          <button type="button" data-drive="right">DROITE<br>▶</button>
          <span></span>
          <button type="button" data-drive="back">RECUL<br>▼</button>
          <span></span>
        </div>
        <div id="speedRow" class="speed-row">
          <button type="button" data-speed="25" title="~9 rpm">25%</button>
          <button type="button" data-speed="50" title="~18 rpm">50%</button>
          <button type="button" data-speed="75" title="~28 rpm">75%</button>
          <button class="active" type="button" data-speed="100" title="~37 rpm">100%</button>
        </div>
      </div>

      <div class="card">
        <div class="pt-grid">
          <span></span><button id="tiltUpBtn" type="button">▲</button><span></span>
          <button id="panLeftBtn" type="button">◀</button>
          <div class="pt-readout"><span>P <b id="panValue">95</b>°</span><span>T <b id="tiltValue">90</b>°</span></div>
          <button id="panRightBtn" type="button">▶</button>
          <span></span><button id="tiltDownBtn" type="button">▼</button><span></span>
        </div>
        <div class="button-row">
          <button id="centerPtBtn" type="button">CENTRE</button>
          <button id="tiltHighBtn" type="button">TILT 145°</button>
          <button id="tiltLowBtn" type="button">TILT 68°</button>
        </div>
      </div>

    </aside>
  </main>

  <div id="ssidModalOverlay" class="modal-overlay">
    <div class="modal-box">
      <h2>Wi‑Fi client</h2>
      <label for="ssidInput">SSID</label>
      <input id="ssidInput" type="text" maxlength="32" autocomplete="off" placeholder="Nom du réseau">
      <label for="ssidPassInput">Mot de passe</label>
      <input id="ssidPassInput" type="password" maxlength="63" autocomplete="off" placeholder="Vide si réseau ouvert">
      <div id="ssidModalMsg" class="modal-msg"></div>
      <div class="button-row two">
        <button id="ssidConnectBtn" class="green" type="button">CONNECTER</button>
        <button id="ssidCancelBtn" type="button">ANNULER</button>
      </div>
    </div>
  </div>

  <script>
  "use strict";

  const state = {
    driveToken: "terrain4-" + Date.now() + "-" + Math.floor(Math.random() * 1e9),
    driveSeq: 0,
    serverOffsetMs: 0,
    driveGeneration: 0,
    driveTimer: null,
    driveCommand: null,
    driveDirection: null,
    driveSpeed: 100,
    driveInFlight: false,
    pan: 95,
    tilt: 90,
    lightOn: false,
    relay2On: false,
    videoOn: false,
    lidarTick: 0,
    lidarTimer: null,
    lidarStopped: false,
    lidarZoom: 1.0,
    lastLidar: null,
    lastRtt: null,
    camGeneration: 0,
    camDecoding: false,
    camPendingFrame: null
  };

  const $ = id => document.getElementById(id);

  function log(message) {
    console.log("[Terrain4] " + message);
  }

  function setPill(id, text, level="") {
    const el = $(id);
    if (!el) return;
    el.textContent = text;
    el.className = "pill" + (level ? " " + level : "");
  }

  async function fetchJson(url, options={}, timeoutMs=1800) {
    const started = performance.now();
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(url, Object.assign({}, options, {
        signal: controller.signal,
        cache: "no-store"
      }));
      const text = await response.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; }
      catch (_) { data = {ok: response.ok, text: text}; }
      data.__rtt = Math.round(performance.now() - started);
      if (!response.ok) {
        throw new Error((data.error || ("HTTP " + response.status)));
      }
      noteRtt(data.__rtt);
      return data;
    } finally {
      clearTimeout(timer);
    }
  }

  function noteRtt(ms) {
    if (!Number.isFinite(ms)) return;
    state.lastRtt = ms;
    const level = ms < 80 ? "ok" : (ms < 250 ? "warn" : "bad");
    setPill("linkState", "Lien " + ms + " ms", level);
  }

  async function syncServerClock(showLog=false) {
    const before = Date.now();
    try {
      const data = await fetchJson("/drive_time", {}, 1800);
      const after = Date.now();
      const midpoint = Math.round((before + after) / 2);
      state.serverOffsetMs = Number(data.server_ms) - midpoint;
      state.driveSeq = Math.max(state.driveSeq, Number(data.server_ms) || 0);
      if (showLog) log("Lien et horloge synchronisés en " + data.__rtt + " ms.");
      return true;
    } catch (error) {
      setPill("linkState", "Lien en erreur", "bad");
      if (showLog) log("Test lien impossible : " + error.message);
      return false;
    }
  }

  function nextDriveSeq() {
    state.driveSeq = Math.max(state.driveSeq + 1, Date.now());
    return state.driveSeq;
  }

  function buildDrivePayload(command) {
    return {
      cmd: command,
      drive_seq: nextDriveSeq(),
      drive_token: state.driveToken,
      sent_server_ms: Math.round(Date.now() + state.serverOffsetMs)
    };
  }

  async function sendDrive(command, quiet=false) {
    const started = performance.now();
    try {
      const data = await fetchJson("/cmd", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(buildDrivePayload(command))
      }, 1600);
      if (data.ok === false && !quiet) log("Moteurs refusés : " + (data.error || "erreur"));
      return data;
    } catch (error) {
      if (!quiet) log("Commande moteur impossible : " + error.message);
      return {ok: false, error: error.message};
    }
  }

  function commandFor(direction) {
    const v = state.driveSpeed;
    if (direction === "forward") return "d" + v + "," + v;
    if (direction === "back") return "d-" + v + ",-" + v;
    if (direction === "left") return "d-" + v + "," + v;
    if (direction === "right") return "d" + v + ",-" + v;
    return "d0,0";
  }

  function paintDrive(direction) {
    document.querySelectorAll("#drivePad button").forEach(button => {
      button.classList.toggle("active", button.dataset.drive === direction && direction !== "stop");
    });
  }

  async function drivePulse(generation, quiet=false) {
    if (generation !== state.driveGeneration || !state.driveCommand) return;
    const result = await sendDrive(state.driveCommand, quiet);
    if (result && result.ok === false && !quiet) log("Mouvement refusé.");
    if (generation !== state.driveGeneration || !state.driveCommand) return;
    state.driveTimer = setTimeout(() => drivePulse(generation, true), 280);
  }

  function startDrive(direction) {
    if (direction === "stop") {
      stopDrive("bouton STOP");
      return;
    }
    state.driveGeneration += 1;
    clearTimeout(state.driveTimer);
    state.driveCommand = commandFor(direction);
    state.driveDirection = direction;
    paintDrive(direction);
    log("Conduite " + direction + " à d" + state.driveSpeed + ".");
    void drivePulse(state.driveGeneration, false);
  }

  function stopDrive(reason="relâchement") {
    state.driveGeneration += 1;
    state.driveCommand = null;
    state.driveDirection = null;
    clearTimeout(state.driveTimer);
    paintDrive("stop");

    // Chaque STOP possède une séquence plus récente. Toute commande de mouvement
    // encore en transit devient donc périmée côté serveur.
    void sendDrive("d0,0", true);
    setTimeout(() => void sendDrive("d0,0", true), 90);
    setTimeout(() => void sendDrive("d0,0", true), 220);
    if (reason === "bouton STOP") log("STOP prioritaire envoyé.");
  }

  function bindDrivePad() {
    document.querySelectorAll("#drivePad button").forEach(button => {
      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        try { button.setPointerCapture(event.pointerId); } catch (_) {}
        startDrive(button.dataset.drive);
      });
      button.addEventListener("pointerup", event => {
        event.preventDefault();
        if (button.dataset.drive !== "stop") stopDrive();
      });
      button.addEventListener("pointermove", event => {
        if (!state.driveDirection) return;
        const target = document.elementFromPoint(event.clientX, event.clientY);
        const nextButton = target && target.closest("#drivePad button");
        if (!nextButton || nextButton.dataset.drive === "stop") return;
        if (nextButton.dataset.drive !== state.driveDirection) startDrive(nextButton.dataset.drive);
      });
      button.addEventListener("pointercancel", () => stopDrive("annulation"));
      button.addEventListener("lostpointercapture", () => stopDrive("pointeur perdu"));
      button.addEventListener("contextmenu", event => event.preventDefault());
    });

    document.querySelectorAll("#speedRow button").forEach(button => {
      button.addEventListener("click", () => {
        state.driveSpeed = Number(button.dataset.speed);
        document.querySelectorAll("#speedRow button").forEach(b => b.classList.toggle("active", b === button));
        log("Vitesse sélectionnée : " + button.textContent + " (d" + state.driveSpeed + ").");
      });
    });
  }

  async function sendAccessoryCommand(command) {
    try {
      const data = await fetchJson("/cmd", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({cmd: command})
      }, 2200);
      if (data.ok === false) throw new Error(data.error || "commande refusée");
      return true;
    } catch (error) {
      log("Commande " + command + " impossible : " + error.message);
      return false;
    }
  }

  function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }

  async function movePan(delta) {
    state.pan = clamp(state.pan + delta, state.tilt >= 135 ? 60 : 50, state.tilt >= 135 ? 135 : 140);
    $("panValue").textContent = state.pan;
    await sendAccessoryCommand("p" + state.pan);
  }

  async function moveTilt(delta) {
    state.tilt = clamp(state.tilt + delta, 68, 145);
    if (state.tilt >= 135) state.pan = clamp(state.pan, 60, 135);
    $("panValue").textContent = state.pan;
    $("tiltValue").textContent = state.tilt;
    if (state.tilt >= 135) await sendAccessoryCommand("p" + state.pan);
    await sendAccessoryCommand("t" + state.tilt);
  }

  async function centerPanTilt() {
    state.pan = 95;
    state.tilt = 90;
    $("panValue").textContent = state.pan;
    $("tiltValue").textContent = state.tilt;
    await sendAccessoryCommand("p95");
    setTimeout(() => void sendAccessoryCommand("t90"), 180);
  }

  async function loadSwitch(path, buttonId, label, key) {
    try {
      const data = await fetchJson(path, {}, 6000);
      state[key] = String(data.state).toLowerCase() === "on";
      paintSwitch(buttonId, label, state[key], data.ok !== false);
      return data.ok !== false;
    } catch (_) {
      paintSwitch(buttonId, label, false, false);
      return false;
    }
  }

  function paintSwitch(buttonId, label, on, ok=true) {
    const button = $(buttonId);
    button.textContent = label + (ok ? (on ? " ON" : " OFF") : " ERREUR");
    button.className = ok ? (on ? "green" : "") : "red";
  }

  async function toggleSwitch(path, buttonId, label, key) {
    const button = $(buttonId);
    button.disabled = true;
    button.textContent = label + " …";

    // Relire l'état réel avant chaque bascule. Ainsi, même si une réponse
    // précédente s'est perdue après avoir actionné le GPIO, le prochain clic
    // enverra bien l'ordre inverse.
    try {
      const before = await fetchJson(path, {}, 6000);
      if (before && (before.state === "on" || before.state === "off")) {
        state[key] = before.state === "on";
      }
    } catch (_) {}

    const desired = !state[key];
    try {
      const data = await fetchJson(path, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({state: desired ? "on" : "off"})
      }, 8000);
      if (data.ok === false) throw new Error(data.error || "commande refusée");
      state[key] = String(data.state).toLowerCase() === "on";
      paintSwitch(buttonId, label, state[key], true);
      log(label + (state[key] ? " activé." : " désactivé."));
    } catch (error) {
      // La commande peut avoir été exécutée malgré une réponse perdue.
      // Resynchroniser le bouton avec l'état GPIO plutôt que deviner.
      await new Promise(resolve => setTimeout(resolve, 500));
      const synchronized = await loadSwitch(path, buttonId, label, key);
      if (!synchronized) paintSwitch(buttonId, label, state[key], false);
      log(label + " : réponse perdue ou erreur — état relu sur RB2.");
    } finally {
      button.disabled = false;
    }
  }

  function normalizeLidarPoint(point) {
    if (Array.isArray(point) && point.length >= 2) {
      const x = Number(point[0]);
      const y = Number(point[1]);
      return Number.isFinite(x) && Number.isFinite(y) ? {x, y} : null;
    }
    if (!point || typeof point !== "object") return null;
    let x = Number(point.x_cm ?? point.x);
    let y = Number(point.y_cm ?? point.y);
    if (!Number.isFinite(x) && point.x_mm !== undefined) x = Number(point.x_mm) / 10;
    if (!Number.isFinite(y) && point.y_mm !== undefined) y = Number(point.y_mm) / 10;
    return Number.isFinite(x) && Number.isFinite(y) ? {x, y} : null;
  }

  function cmText(value) {
    const number = Number(value);
    return Number.isFinite(number) ? number.toFixed(0) : "—";
  }

  function drawLidarMap(payload) {
    const canvas = $("lidarCanvas");
    const rect = canvas.getBoundingClientRect();
    const width = Math.max(280, rect.width);
    const height = Math.max(240, rect.height);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    const context = canvas.getContext("2d");
    context.setTransform(dpr, 0, 0, dpr, 0, 0);
    context.fillStyle = "#030607";
    context.fillRect(0, 0, width, height);

    const response = payload || {};
    const data = response.data || response;
    const rawPoints = data.points_cm || response.points_cm || data.points || [];
    const points = Array.isArray(rawPoints) ? rawPoints.map(normalizeLidarPoint).filter(Boolean) : [];
    const clearance = response.clearance || data.clearance || data;
    const centerX = width / 2;
    const centerY = height * 0.58;
    const visibleCm = 220 / state.lidarZoom;
    const scale = Math.min(width, height) * 0.44 / visibleCm;

    context.lineWidth = 1;
    context.strokeStyle = "#1e2a31";
    context.fillStyle = "#71808a";
    context.font = "11px Arial";
    for (let cm = 50; cm <= visibleCm; cm += 50) {
      context.beginPath();
      context.arc(centerX, centerY, cm * scale, 0, Math.PI * 2);
      context.stroke();
      context.fillText(cm + " cm", centerX + cm * scale + 4, centerY - 4);
    }

    context.strokeStyle = "#263943";
    context.beginPath();
    context.moveTo(centerX, 0);
    context.lineTo(centerX, height);
    context.moveTo(0, centerY);
    context.lineTo(width, centerY);
    context.stroke();

    context.fillStyle = "#31d66b";
    for (const point of points) {
      const x = centerX + point.x * scale;
      const y = centerY - point.y * scale;
      if (x < 0 || x > width || y < 0 || y > height) continue;
      context.beginPath();
      context.arc(x, y, 2, 0, Math.PI * 2);
      context.fill();
    }

    const robotWidth = 22 * scale;
    const robotFront = 29 * scale;
    const robotBack = 11 * scale;
    context.fillStyle = "rgba(33, 118, 210, .42)";
    context.strokeStyle = "#69b7ff";
    context.lineWidth = 2;
    context.fillRect(centerX - robotWidth / 2, centerY - robotFront, robotWidth, robotFront + robotBack);
    context.strokeRect(centerX - robotWidth / 2, centerY - robotFront, robotWidth, robotFront + robotBack);
    context.beginPath();
    context.moveTo(centerX, centerY - robotFront - 13);
    context.lineTo(centerX - 7, centerY - robotFront + 2);
    context.lineTo(centerX + 7, centerY - robotFront + 2);
    context.closePath();
    context.fillStyle = "#69b7ff";
    context.fill();

    const summary = "AV " + cmText(clearance.front_cm) +
      "   DR " + cmText(clearance.right_cm) +
      "   AR " + cmText(clearance.back_cm) +
      "   GA " + cmText(clearance.left_cm) +
      "   MIN " + cmText(clearance.min_cm) + " cm";
    context.fillStyle = "rgba(0, 0, 0, .72)";
    context.fillRect(0, height - 30, width, 30);
    context.fillStyle = "#d8e3ea";
    context.font = "bold 12px Arial";
    context.fillText(summary, 9, height - 10);

    const age = Number(response.age_s);
    const fresh = response.ok !== false && (!Number.isFinite(age) || age < 3);
    const label = $("lidarState");
    label.textContent = fresh
      ? "LIDAR " + points.length + " points"
      : "LIDAR ANCIEN";
    label.style.borderColor = fresh ? "#29954d" : "#bd741b";
    label.style.color = fresh ? "#8ff0ae" : "#ffd08a";
  }

  async function updateLidarMap() {
    try {
      const response = await fetchJson("/lidar_map", {}, 7000);
      state.lastLidar = response;
      drawLidarMap(response);
    } catch (error) {
      const label = $("lidarState");
      label.textContent = "LIDAR ERREUR";
      label.style.borderColor = "#c93b4e";
      label.style.color = "#ff9ba8";
    }
  }

  function paintBandButtons(band) {
    const b5 = $("wifi5gBtn");
    b5.textContent = "5G";
    b5.className = band === "5G" ? "green" : "";
  }

  async function refreshWifi() {
    try {
      const data = await fetchJson("/rb2_network/status", {}, 6000);
      const on = data.local_wifi === "ON";
      const button = $("wifiBtn");
      button.textContent = "Wi‑Fi local " + (on ? "ON" : "OFF");
      button.className = on ? "green" : "red";
      button.dataset.state = on ? "ON" : "OFF";
      paintBandButtons(data.band || "UNKNOWN");
      // INFO-PANEL
      const ip = (String(data.ip_line || "").match(/\d+\.\d+\.\d+\.\d+/) || [])[0];
      setPill("infoWifi", data.ssid ? data.ssid + (ip ? " · " + ip : "") : "Wi‑Fi non connecté",
              data.ssid ? "ok" : "warn");
    } catch (_) {
      setPill("infoWifi", "Wi‑Fi ?", "warn");
      $("wifiBtn").textContent = "Wi‑Fi local ?";
      $("wifiBtn").className = "orange";
      $("wifiBtn").dataset.state = "UNKNOWN";
    }
  }

  async function switchWifiBand(path, buttonId, targetBand, pendingText) {
    const button = $(buttonId);
    const original = button.textContent;
    button.disabled = true;
    button.textContent = pendingText;

    try {
      const data = await fetchJson(path, {method: "POST"}, 12000);
      if (data.ok === false) throw new Error((data.result && data.result.output) || data.error || "échec");
    } catch (error) {
      log(original + " : " + error.message);
      button.textContent = original + " ERREUR";
      button.className = "red";
      button.disabled = false;
      return;
    }

    // La commande a été acceptée, mais la ré-association Wi-Fi puis le bail
    // DHCP prennent quelques secondes de plus (variable). On sonde le statut
    // au lieu de se fier à un délai fixe unique, avec une marge de 20 s avant
    // de déclarer une vraie ERREUR.
    button.textContent = pendingText + " (confirmation…)";
    const deadline = Date.now() + 20000;
    while (Date.now() < deadline) {
      await new Promise(resolve => setTimeout(resolve, 1500));
      try {
        const status = await fetchJson("/rb2_network/status", {}, 4000);
        if (status.band === targetBand) {
          log(original + " : bascule confirmée.");
          paintBandButtons(status.band);
          button.textContent = original;
          button.disabled = false;
          return;
        }
      } catch (_) {}
    }

    log(original + " : bande non confirmée après 20 s.");
    button.textContent = original + " ERREUR";
    button.className = "red";
    button.disabled = false;
  }

  function openSsidModal() {
    $("ssidInput").value = "";
    $("ssidPassInput").value = "";
    const msg = $("ssidModalMsg");
    msg.textContent = "";
    msg.className = "modal-msg";
    const btn = $("ssidConnectBtn");
    btn.disabled = false;
    btn.textContent = "CONNECTER";
    $("ssidModalOverlay").classList.add("open");
    $("ssidInput").focus();
  }

  function closeSsidModal() {
    $("ssidModalOverlay").classList.remove("open");
  }

  async function connectSsid() {
    const ssid = $("ssidInput").value.trim();
    const password = $("ssidPassInput").value;
    const msg = $("ssidModalMsg");

    if (!ssid) {
      msg.textContent = "SSID requis.";
      msg.className = "modal-msg error";
      return;
    }

    const btn = $("ssidConnectBtn");
    btn.disabled = true;
    btn.textContent = "CONNEXION…";
    msg.textContent = "Connexion en cours (jusqu’à 25 s)…";
    msg.className = "modal-msg";

    try {
      const data = await fetchJson("/rb2_network/connect_ssid", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ssid, password})
      }, 32000);

      if (data.ok) {
        // nmcli a confirmé l'association, mais si RB2 voit aussi un réseau
        // connu à priorité élevée (ex. WIFI-MAISON-5G-nanoHD, priorité pinnée),
        // NetworkManager peut y revenir tout seul quelques secondes plus
        // tard. On vérifie que la connexion tient avant de déclarer succès.
        msg.textContent = "Connecté, confirmation…";
        let confirmed = false;
        for (let i = 0; i < 5; i++) {
          await new Promise(resolve => setTimeout(resolve, 1200));
          try {
            const status = await fetchJson("/rb2_network/status", {}, 4000);
            if (status.local_wifi === "ON" && status.ssid === ssid) {
              confirmed = true;
              break;
            }
          } catch (_) {}
        }

        if (confirmed) {
          msg.textContent = "Connecté à " + ssid + ".";
          msg.className = "modal-msg ok";
          log("Wi‑Fi client : connecté à " + ssid + ".");
          void refreshWifi();
          setTimeout(closeSsidModal, 1200);
        } else {
          msg.textContent = "Connexion non confirmée après coup — réessayer.";
          msg.className = "modal-msg error";
          log("Wi‑Fi client : connexion à " + ssid + " non confirmée.");
          btn.disabled = false;
          btn.textContent = "CONNECTER";
        }
      } else {
        const detail = (data.result && data.result.output) || data.error || "échec";
        msg.textContent = "Échec : " + detail;
        msg.className = "modal-msg error";
        log("Wi‑Fi client : échec de connexion à " + ssid + ".");
        btn.disabled = false;
        btn.textContent = "CONNECTER";
      }
    } catch (error) {
      msg.textContent = "Erreur : " + error.message;
      msg.className = "modal-msg error";
      btn.disabled = false;
      btn.textContent = "CONNECTER";
    }
  }

  async function disconnectClientWifi() {
    const btn = $("wifiDisconnectBtn");
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = "DÉCONNEXION…";
    try {
      const data = await fetchJson("/rb2_network/disconnect_client", {method: "POST"}, 20000);
      const state = data.state || {};
      const ssid = state.ssid || "?";
      if (state.local_wifi === "ON") {
        log("Wi‑Fi client : déconnecté, reconnecté au réseau local (" + ssid + ").");
      } else {
        log("Wi‑Fi client : déconnecté, mais aucun réseau local n'a repris (Wi‑Fi local " + (state.local_wifi || "?") + ").");
      }
      void refreshWifi();
    } catch (error) {
      log("Déconnexion Wi‑Fi client : erreur — " + error.message);
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  async function toggleWifi() {
    const button = $("wifiBtn");
    const current = button.dataset.state || "UNKNOWN";
    const wording = current === "ON" ? "couper" : "réactiver";
    if (!confirm("Voulez-vous " + wording + " le Wi‑Fi local wlan0 ?\n\nLe point d’accès RB2 10.42.0.1 ne sera pas touché.")) return;
    button.disabled = true;
    button.textContent = "Wi‑Fi local…";
    try {
      const data = await fetchJson("/rb2_network/toggle", {method: "POST"}, 18000);
      const after = data.after || data.state || {};
      const on = after.local_wifi === "ON";
      button.dataset.state = on ? "ON" : "OFF";
      button.textContent = "Wi‑Fi local " + (on ? "ON" : "OFF");
      button.className = on ? "green" : "red";
      log("Wi‑Fi local " + (on ? "réactivé." : "désactivé."));
    } catch (error) {
      if (current === "ON") {
        button.dataset.state = "OFF";
        button.textContent = "Wi‑Fi local OFF ?";
        button.className = "red";
        log("Connexion perdue pendant la coupure de wlan0; cela peut être normal.");
      } else {
        log("Bascule Wi‑Fi impossible : " + error.message);
      }
    } finally {
      button.disabled = false;
      setTimeout(() => void refreshWifi(), 2500);
    }
  }

  // INFO-PANEL:BEGIN — bandeau d'état + capteurs ToF eau (retrait : supprimer les blocs INFO-PANEL)
  // Requêtes volontairement légères et séquentielles (mêmes précautions que la caméra),
  // sans fetchJson : noteRtt() alimenterait à tort le voyant « Lien ».
  // Seuils EAU identiques à ceux de /lidar_drive2 (LD2_WATER_*) : sol ~60 mm à sec,
  // plafond ~600 mm à sec ; ces capteurs surveillent l'eau, pas les obstacles.
  const INFO = {
    floorLow: 40, floorHigh: 80, ceilLow: 400, ceilHigh: 800,
    invalidAlertMs: 3000, maxAgeS: 5, pollMs: 2000, statusEvery: 3,
    floorInvalidSince: null, ceilInvalidSince: null, tick: 0
  };

  async function infoGet(url) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 3000);
    try {
      const response = await fetch(url, {cache: "no-store", signal: controller.signal});
      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function infoWater(label, id, value, sinceKey, low, high) {
    // value = mm valide ou null ; alarme si hors plage ou invalide > 3 s.
    if (value !== null) INFO[sinceKey] = null;
    else if (INFO[sinceKey] === null) INFO[sinceKey] = Date.now();
    const invalidTooLong = INFO[sinceKey] !== null && (Date.now() - INFO[sinceKey]) > INFO.invalidAlertMs;
    if (value === null) {
      setPill(id, label + " : ?", invalidTooLong ? "bad blink" : "warn");
    } else {
      const alert = value < low || value > high;
      setPill(id, label + " : " + value + " mm", alert ? "bad blink" : "ok");
    }
  }

  async function infoRefreshFloor() {
    let mm = null;
    try {
      const j = await infoGet("/vl53l1x_json");
      const d = j && j.data;
      if (j && j.ok !== false && !(j.age_s > INFO.maxAgeS) && d && d.ok === true && d.valid === true
          && typeof d.distance_mm === "number") mm = d.distance_mm;
    } catch (_) {}
    infoWater("SOL", "infoFloor", mm, "floorInvalidSince", INFO.floorLow, INFO.floorHigh);
  }

  async function infoRefreshCeiling() {
    let mm = null;
    try {
      const j = await infoGet("/vl53l5cx_json");
      const d = j && j.data;
      if (j && j.ok !== false && !(j.age_s > INFO.maxAgeS) && d && d.ok === true
          && typeof d.min_valid_distance_mm === "number") {
        mm = d.min_valid_distance_mm;
      }
    } catch (_) {}
    infoWater("PLAFOND", "infoCeil", mm, "ceilInvalidSince", INFO.ceilLow, INFO.ceilHigh);
  }

  // Horizon artificiel + niveaux roulis/tangage. Si le sens est inversé sur le robot
  // (mesuré au banc), passer le signe correspondant à -1.
  const TILT = {rollSign: 1, pitchSign: 1, last: null};

  function drawTilt() {
    const canvas = $("infoTiltCanvas");
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const d = TILT.last;
    const roll = d ? d.roll * TILT.rollSign : 0;
    const pitch = d ? d.pitch * TILT.pitchSign : 0;

    // Boule d'horizon à gauche
    const r = h / 2 - 6, cx = r + 8, cy = h / 2;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    ctx.translate(cx, cy);
    ctx.rotate(-roll * Math.PI / 180);
    const off = clamp(pitch, -35, 35) * (r / 40);   // tangage positif = horizon descend
    ctx.fillStyle = "#2f6fb0"; ctx.fillRect(-2 * r, -2 * r + off, 4 * r, 2 * r);
    ctx.fillStyle = "#8a5a2b"; ctx.fillRect(-2 * r, off, 4 * r, 2 * r);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-2 * r, off); ctx.lineTo(2 * r, off); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = "#8b98a5"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    // Repère fixe du robot
    ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - r * .55, cy); ctx.lineTo(cx - r * .15, cy);
    ctx.moveTo(cx + r * .15, cy); ctx.lineTo(cx + r * .55, cy);
    ctx.stroke();
    ctx.fillStyle = "#ffd23f"; ctx.fillRect(cx - 2, cy - 2, 4, 4);

    // Barres de niveau à droite (bulle) : roulis puis tangage, ±30°
    const x0 = cx + r + 22, x1 = w - 12, mid = (x0 + x1) / 2, span = (x1 - x0) / 2;
    const bar = (label, value, y) => {
      ctx.fillStyle = "#aab5bf"; ctx.font = "bold 11px Arial"; ctx.textAlign = "left";
      ctx.fillText(label, x0, y - 12);
      ctx.textAlign = "right";
      ctx.fillStyle = d ? "#f2f5f7" : "#7a8590";
      ctx.fillText(d ? (value >= 0 ? "+" : "−") + Math.abs(value).toFixed(1) + "°" : "—", x1, y - 12);
      ctx.fillStyle = "#151b21"; ctx.fillRect(x0, y - 5, x1 - x0, 10);
      ctx.strokeStyle = "#485562"; ctx.lineWidth = 1; ctx.strokeRect(x0 + .5, y - 4.5, x1 - x0 - 1, 9);
      ctx.strokeStyle = "#8b98a5"; ctx.beginPath(); ctx.moveTo(mid, y - 8); ctx.lineTo(mid, y + 8); ctx.stroke();
      if (d) {
        const v = clamp(value, -30, 30);
        const big = Math.abs(value) >= 15;
        ctx.fillStyle = big ? "#ff6b6b" : "#7be0a0";
        ctx.beginPath(); ctx.arc(mid + v / 30 * span, y, 7, 0, Math.PI * 2); ctx.fill();
      }
    };
    bar("ROULIS", roll, h * .30);
    bar("TANGAGE", pitch, h * .62);
    ctx.fillStyle = "#aab5bf"; ctx.font = "bold 11px Arial"; ctx.textAlign = "left";
    ctx.fillText(d ? "CAP " + Math.round(d.heading) + "°" : "IMU ?", x0, h - 8);
  }

  async function infoRefreshTilt() {
    try {
      const j = await infoGet("/imu_json");
      const d = j && j.data;
      if (!j || j.ok === false || !d || j.age_s > INFO.maxAgeS
          || !Number.isFinite(d.roll_deg) || !Number.isFinite(d.pitch_deg)) throw new Error("imu");
      TILT.last = {roll: d.roll_deg, pitch: d.pitch_deg, heading: d.heading_deg};
    } catch (_) {
      TILT.last = null;
    }
    drawTilt();
  }

  async function infoRefreshSensors() {
    try {
      const j = await infoGet("/terrain_status");
      const problems = [].concat(j.errors || [], j.warnings || []);
      setPill("infoSensors", problems.length ? problems.join(", ") : "Capteurs OK",
              j.level === "error" ? "bad" : (j.level === "warn" ? "warn" : "ok"));
    } catch (_) {
      setPill("infoSensors", "Capteurs ?", "warn");
    }
  }

  async function infoLoop() {
    if (!document.hidden) {
      try {
        await infoRefreshFloor();
        await infoRefreshCeiling();
        await infoRefreshTilt();
        if (INFO.tick % INFO.statusEvery === 0) await infoRefreshSensors();
        INFO.tick += 1;
      } catch (_) {}
    }
    setTimeout(infoLoop, INFO.pollMs);
  }
  // INFO-PANEL:END

  async function lidarMapLoop() {
    if (state.lidarStopped) return;
    if (document.hidden) {
      state.lidarTimer = setTimeout(lidarMapLoop, 2000);
      return;
    }

    try {
      await updateLidarMap();
      if (state.lidarTick % 20 === 0) await refreshWifi();
      state.lidarTick += 1;
    } finally {
      state.lidarTimer = setTimeout(lidarMapLoop, 2000);
    }
  }

  // Visionneuse caméra "dernière image seulement" : un <img> multipart/x-mixed-replace
  // n'a aucun mécanisme de saut d'image, donc le moindre retard de décodage
  // s'accumule pour toujours tant que la connexion reste ouverte (constaté en
  // conditions réelles : plusieurs secondes de lag, non résorbées par un simple
  // rechargement périodique). Ici on lit le flux nous-mêmes en JS, on découpe les
  // trames JPEG (marqueurs SOI/EOI) et on ne décode/affiche jamais que la plus
  // récente trame complète disponible, en jetant les plus vieilles — le retard
  // reste donc borné au temps réseau + un décodage, quelle que soit la charge du
  // thread JS de la page.
  function concatBytes(a, b) {
    const out = new Uint8Array(a.length + b.length);
    out.set(a, 0);
    out.set(b, a.length);
    return out;
  }

  function indexOfMarker(buf, b0, b1, from) {
    const end = buf.length - 1;
    for (let i = from; i < end; i++) {
      if (buf[i] === b0 && buf[i + 1] === b1) return i;
    }
    return -1;
  }

  // Extrait la dernière trame JPEG complète du buffer, si présente. Rend aussi
  // le reste du buffer (après la dernière trame consommée) pour la suite.
  function extractLatestFrame(buf) {
    let searchFrom = 0;
    let lastFrame = null;
    let lastFrameEnd = 0;
    while (true) {
      const soi = indexOfMarker(buf, 0xff, 0xd8, searchFrom);
      if (soi === -1) break;
      const eoi = indexOfMarker(buf, 0xff, 0xd9, soi + 2);
      if (eoi === -1) break;
      lastFrame = buf.subarray(soi, eoi + 2);
      lastFrameEnd = eoi + 2;
      searchFrom = eoi + 2;
    }
    if (lastFrame) return { frame: lastFrame, rest: buf.subarray(lastFrameEnd) };
    // Aucune trame complète : sécurité anti-dérive mémoire si le flux est corrompu.
    if (buf.length > 3_000_000) return { frame: null, rest: new Uint8Array(0) };
    return { frame: null, rest: buf };
  }

  function drawCameraBitmap(bitmap) {
    const canvas = $("camera");
    if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
    }
    canvas.getContext("2d").drawImage(bitmap, 0, 0);
  }

  async function handleNewCameraFrame(frameBytes) {
    state.camPendingFrame = frameBytes;
    if (state.camDecoding) return;
    while (state.camPendingFrame) {
      const toDecode = state.camPendingFrame;
      state.camPendingFrame = null;
      state.camDecoding = true;
      try {
        const bitmap = await createImageBitmap(new Blob([toDecode], {type: "image/jpeg"}));
        drawCameraBitmap(bitmap);
        bitmap.close();
      } catch (_) {
        // Trame corrompue (coupée en plein milieu) : on l'ignore, la suivante arrive vite.
      } finally {
        state.camDecoding = false;
      }
    }
  }

  async function runCameraViewer(generation) {
    while (generation === state.camGeneration) {
      try {
        const response = await fetch("/zero_cam_stream.mjpg?t=" + Date.now(), {cache: "no-store"});
        if (!response.ok || !response.body) throw new Error("HTTP " + response.status);
        const reader = response.body.getReader();
        let buf = new Uint8Array(0);
        let connected = false;
        while (generation === state.camGeneration) {
          const {done, value} = await reader.read();
          if (done) break;
          buf = concatBytes(buf, value);
          const extracted = extractLatestFrame(buf);
          buf = extracted.rest;
          if (extracted.frame) {
            if (!connected) {
              connected = true;
              $("cameraState").textContent = "flux actif";
            }
            void handleNewCameraFrame(extracted.frame);
          }
        }
        if (generation === state.camGeneration) throw new Error("flux terminé");
      } catch (error) {
        if (generation !== state.camGeneration) return;
        $("cameraState").textContent = "flux en erreur — reconnexion…";
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
    }
  }

  function reloadCamera() {
    state.camGeneration += 1;
    $("cameraState").textContent = "reconnexion…";
    void runCameraViewer(state.camGeneration);
  }

  async function cameraAction(path, buttonId, pendingText, timeoutMs=12000) {
    const button = $(buttonId);
    const original = button.textContent;
    button.disabled = true;
    button.textContent = pendingText;
    try {
      const data = await fetchJson(path, {method: "POST"}, timeoutMs);
      if (data.ok === false) throw new Error(data.error || data.stderr || "échec");
      log(original + " : commande réussie.");
      return true;
    } catch (error) {
      log(original + " : " + error.message);
      return false;
    } finally {
      button.disabled = false;
      button.textContent = original;
    }
  }

  async function updateVideoStatus() {
    try {
      const data = await fetchJson("/zero_video_status", {}, 4500);
      state.videoOn = !!(data.recording || data.video_on || data.active || data.on);
      $("videoBtn").textContent = state.videoOn ? "ARRÊTER VIDÉO" : "VIDÉO";
      $("videoBtn").className = state.videoOn ? "red" : "orange";
    } catch (_) {
      $("videoBtn").textContent = "VIDÉO ?";
    }
  }

  async function shutdownRb2() {
    if (!confirm("Confirmer l’arrêt complet de RB2 ?\n\nLe Zero 2 W sera arrêté, puis le Raspberry Pi 5.")) return;
    stopDrive("arrêt système");
    const button = $("shutdownBtn");
    button.disabled = true;
    button.textContent = "ARRÊT EN COURS…";
    try {
      const data = await fetchJson("/system_shutdown_all", {method: "POST"}, 5000);
      if (data.ok === false) throw new Error(data.error || "échec");
      log("Arrêt complet demandé.");
    } catch (error) {
      log("Réponse d’arrêt perdue : " + error.message + ". Vérifiez si RB2 s’éteint.");
    }
  }

  function bindControls() {
    bindDrivePad();
    $("panLeftBtn").addEventListener("click", () => void movePan(-5));
    $("panRightBtn").addEventListener("click", () => void movePan(5));
    $("tiltUpBtn").addEventListener("click", () => void moveTilt(5));
    $("tiltDownBtn").addEventListener("click", () => void moveTilt(-5));
    $("centerPtBtn").addEventListener("click", () => void centerPanTilt());
    $("tiltHighBtn").addEventListener("click", () => {
      state.tilt = 145;
      state.pan = clamp(state.pan, 60, 135);
      $("panValue").textContent = state.pan;
      $("tiltValue").textContent = "145";
      void sendAccessoryCommand("p" + state.pan);
      setTimeout(() => void sendAccessoryCommand("t145"), 180);
    });
    $("tiltLowBtn").addEventListener("click", () => { state.tilt = 68; $("tiltValue").textContent = "68"; void sendAccessoryCommand("t68"); });
    $("lightBtn").addEventListener("click", () => void toggleSwitch("/light", "lightBtn", "LUMIÈRES", "lightOn"));
    $("relay2Btn").addEventListener("click", () => void toggleSwitch("/relay2", "relay2Btn", "RELAIS 2", "relay2On"));
    $("wifiBtn").addEventListener("click", () => void toggleWifi());
    $("wifi5gBtn").addEventListener("click", () => void switchWifiBand("/rb2_network/wifi_5g", "wifi5gBtn", "5G", "5G…"));
    $("wifiSsidBtn").addEventListener("click", openSsidModal);
    $("wifiDisconnectBtn").addEventListener("click", () => void disconnectClientWifi());
    $("ssidCancelBtn").addEventListener("click", closeSsidModal);
    $("ssidConnectBtn").addEventListener("click", () => void connectSsid());
    $("ssidModalOverlay").addEventListener("click", (event) => {
      if (event.target === $("ssidModalOverlay")) closeSsidModal();
    });
    $("ssidPassInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") { event.preventDefault(); void connectSsid(); }
    });
    $("lidarZoomOutBtn").addEventListener("click", () => {
      state.lidarZoom = Math.max(.45, state.lidarZoom / 1.25);
      if (state.lastLidar) drawLidarMap(state.lastLidar);
    });
    $("lidarZoomInBtn").addEventListener("click", () => {
      state.lidarZoom = Math.min(3, state.lidarZoom * 1.25);
      if (state.lastLidar) drawLidarMap(state.lastLidar);
    });
    $("reloadCameraBtn").addEventListener("click", reloadCamera);
    $("photoBtn").addEventListener("click", () => void cameraAction("/zero_photo", "photoBtn", "PHOTO…"));
    $("videoBtn").addEventListener("click", async () => {
      if (await cameraAction("/zero_video_toggle", "videoBtn", "VIDÉO…")) setTimeout(() => void updateVideoStatus(), 500);
    });
    $("restartCameraBtn").addEventListener("click", async () => {
      if (!confirm("Redémarrer seulement le service caméra du Zero 2 W ?")) return;
      if (await cameraAction("/zero_cam_restart", "restartCameraBtn", "RESTART…", 80000)) setTimeout(reloadCamera, 1500);
    });
    $("shutdownBtn").addEventListener("click", () => void shutdownRb2());
  }

  function emergencyStopBeacon() {
    try {
      const payload = JSON.stringify(buildDrivePayload("d0,0"));
      navigator.sendBeacon("/cmd", new Blob([payload], {type: "application/json"}));
    } catch (_) {}
  }

  async function initialize() {
    bindControls();
    paintDrive("stop");
    await syncServerClock(false);
    // Initialisation volontairement séquentielle : aucune rafale de requêtes
    // au chargement pendant que le flux MJPEG établit sa connexion.
    await loadSwitch("/light", "lightBtn", "LUMIÈRES", "lightOn");
    await loadSwitch("/relay2", "relay2Btn", "RELAIS 2", "relay2On");
    await refreshWifi();
    await updateVideoStatus();
    reloadCamera();
    lidarMapLoop();
    setTimeout(infoLoop, 3000); // INFO-PANEL
  }

  window.addEventListener("blur", () => stopDrive("fenêtre inactive"));
  window.addEventListener("offline", () => stopDrive("hors ligne"));
  window.addEventListener("beforeunload", emergencyStopBeacon);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopDrive("onglet masqué");
  });
  window.addEventListener("resize", () => {
    if (state.lastLidar) drawLidarMap(state.lastLidar);
    drawTilt(); // INFO-PANEL
  });
  document.addEventListener("DOMContentLoaded", () => void initialize());
  </script>
</body>
</html>
